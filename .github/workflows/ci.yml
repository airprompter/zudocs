# CI for every push and pull request: the header and key rules, typecheck, the
# infra assertions, and a synth with a placeholder account and no budget e-mail
# (so a fork or a checkout with no credentials still proves the templates
# build). Nothing here can deploy — no id-token permission exists in this
# workflow; deploy.yml is the only one with cloud access.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check-headers
      - run: npm run check-keys
      - run: npm run typecheck
      - run: npm test
      - run: npm run synth
