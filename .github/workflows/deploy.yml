# Deploy from main through GitHub OIDC. Two jobs on purpose: `test` installs
# and runs everything with no id-token permission at all (a dependency's
# lifecycle script cannot mint one), and `deploy` — the only job that may
# request a token — installs with --ignore-scripts and assumes the one role
# the CI stack created (zudocs-deploy), which may only assume the CDK bootstrap
# roles. That role's trust is the `ref:` form of the subject, so this job names
# no GitHub environment. CI deploys the DNS and site stacks, never ZudocsCi:
# the thing that assumes the role must not be the thing that can break it.
#
# Repository variables (Settings › Variables — none of these is a secret):
#   AWS_ACCOUNT_ID   the demo account
#   BUDGET_EMAIL     where the budget and anomaly alerts go
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check-headers
      - run: npm run check-keys
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: The budget has a recipient
        run: test -n "$BUDGET_EMAIL" || { echo "set the BUDGET_EMAIL repository variable"; exit 1; }
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/zudocs-deploy
          aws-region: us-east-1
      - name: Deploy the DNS and site stacks
        # The account comes from the assumed credentials (CDK_DEFAULT_ACCOUNT); no variable reaches the shell text.
        run: npx cdk deploy ZudocsDns ZudocsSite --require-approval never
        working-directory: infra
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
