# Deploy from main through GitHub OIDC: the workflow assumes the one role the
# CI stack created (zudocs-deploy), which may only assume the CDK bootstrap
# roles. No long-lived key exists anywhere in this repository or its settings.
#
# Repository variables (Settings › Variables, not secrets — none of these is one):
#   AWS_ACCOUNT_ID   the demo account
#   BUDGET_EMAIL     where the budget and anomaly alerts go
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/zudocs-deploy
          aws-region: us-east-1
      - name: Deploy every stack
        run: npx cdk deploy --all --require-approval never --context account=${{ vars.AWS_ACCOUNT_ID }}
        working-directory: infra
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
